<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 480" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <style>
    .bg { fill: transparent; }
    .label { fill: #111827; font-size: 14px; }
    .small { fill: #374151; font-size: 12px; }
    .title { fill: #111827; font-size: 16px; font-weight: 600; }
    .box { fill: #ffffff; stroke: #111827; stroke-width: 1.5; }
    .box-norm { fill: #fef3c7; stroke: #b45309; stroke-width: 1.5; }
    .box-sub  { fill: #dbeafe; stroke: #1d4ed8; stroke-width: 1.5; }
    .plus { fill: #ffffff; stroke: #111827; stroke-width: 1.5; }
    .plus-text { fill: #111827; font-size: 18px; font-weight: 700; }
    .arrow { fill: none; stroke: #111827; stroke-width: 1.5; marker-end: url(#arrow); }
    .arrow-dim { fill: none; stroke: #6b7280; stroke-width: 1.5; stroke-dasharray: 4 3; marker-end: url(#arrow-dim); }
    .skip-label { fill: #6b7280; font-size: 11px; font-style: italic; }
    @media (prefers-color-scheme: dark) {
      .label { fill: #e5e7eb; }
      .small { fill: #cbd5e1; }
      .title { fill: #f3f4f6; }
      .box { fill: #1f2937; stroke: #e5e7eb; }
      .box-norm { fill: #78350f; stroke: #fbbf24; }
      .box-sub  { fill: #1e3a8a; stroke: #93c5fd; }
      .plus { fill: #1f2937; stroke: #e5e7eb; }
      .plus-text { fill: #e5e7eb; }
      .arrow { stroke: #e5e7eb; }
      .arrow-dim { stroke: #9ca3af; }
      .skip-label { fill: #9ca3af; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect class="bg" width="100%" height="100%"/>

  <!-- POST-LN (left) -->
  <text class="title" x="180" y="32" text-anchor="middle">Post-LN (AIAYN)</text>

  <!-- input -->
  <text class="label" x="180" y="60" text-anchor="middle">x</text>
  <line class="arrow" x1="180" y1="68" x2="180" y2="110"/>

  <!-- sub-layer -->
  <rect class="box-sub" x="120" y="110" width="120" height="44" rx="6"/>
  <text class="label" x="180" y="138" text-anchor="middle">SubLayer</text>

  <!-- skip arc -->
  <path class="arrow-dim" d="M 180 70 C 290 70, 290 220, 220 220"/>
  <text class="skip-label" x="295" y="148" text-anchor="middle">identity</text>

  <!-- to plus -->
  <line class="arrow" x1="180" y1="154" x2="180" y2="210"/>

  <!-- plus node -->
  <circle class="plus" cx="180" cy="220" r="14"/>
  <text class="plus-text" x="180" y="226" text-anchor="middle">+</text>

  <!-- to LayerNorm -->
  <line class="arrow" x1="180" y1="234" x2="180" y2="280"/>

  <rect class="box-norm" x="120" y="280" width="120" height="44" rx="6"/>
  <text class="label" x="180" y="308" text-anchor="middle">LayerNorm</text>

  <!-- out -->
  <line class="arrow" x1="180" y1="324" x2="180" y2="370"/>
  <text class="label" x="180" y="388" text-anchor="middle">y</text>

  <text class="small" x="180" y="430" text-anchor="middle">y = LN( x + SubLayer(x) )</text>
  <text class="small" x="180" y="450" text-anchor="middle">norm sits on the main path</text>

  <!-- PRE-LN (right) -->
  <text class="title" x="560" y="32" text-anchor="middle">Pre-LN (GPT-2 and modern LLMs)</text>

  <!-- input -->
  <text class="label" x="560" y="60" text-anchor="middle">x</text>
  <line class="arrow" x1="560" y1="68" x2="560" y2="100"/>

  <!-- split branch + main trunk -->
  <!-- branch: LN -> SubLayer -->
  <rect class="box-norm" x="620" y="110" width="120" height="44" rx="6"/>
  <text class="label" x="680" y="138" text-anchor="middle">LayerNorm</text>

  <rect class="box-sub" x="620" y="180" width="120" height="44" rx="6"/>
  <text class="label" x="680" y="208" text-anchor="middle">SubLayer</text>

  <!-- horizontal to branch -->
  <line class="arrow" x1="560" y1="100" x2="620" y2="132"/>
  <line class="arrow" x1="680" y1="154" x2="680" y2="180"/>
  <line class="arrow" x1="680" y1="224" x2="595" y2="252"/>

  <!-- main trunk (identity) -->
  <line class="arrow-dim" x1="560" y1="100" x2="560" y2="252"/>
  <text class="skip-label" x="535" y="180" text-anchor="end">identity</text>

  <!-- plus node -->
  <circle class="plus" cx="560" cy="262" r="14"/>
  <text class="plus-text" x="560" y="268" text-anchor="middle">+</text>

  <!-- to next block -->
  <line class="arrow" x1="560" y1="276" x2="560" y2="370"/>
  <text class="label" x="560" y="388" text-anchor="middle">y</text>

  <text class="small" x="560" y="430" text-anchor="middle">y = x + SubLayer( LN(x) )</text>
  <text class="small" x="560" y="450" text-anchor="middle">norm sits inside the residual branch</text>
</svg>
