<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260"
     font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <style>
    .node  { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.4; }
    .label { fill: #1a1a1a; font-size: 15px; }
    .edge  { stroke: #6b6b6b; stroke-width: 1.4; fill: none; }
    .ah    { fill: #6b6b6b; }
    @media (prefers-color-scheme: dark) {
      .node  { fill: #1f1f24; stroke: #ececec; }
      .label { fill: #ececec; }
      .edge  { stroke: #9a9a9a; }
      .ah    { fill: #9a9a9a; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" class="ah"/>
    </marker>
  </defs>

  <!-- Edges (drawn first so nodes overlap them cleanly) -->
  <line x1="110" y1="130" x2="200" y2="70"  class="edge" marker-end="url(#arrow)"/>
  <line x1="110" y1="130" x2="200" y2="190" class="edge" marker-end="url(#arrow)"/>
  <line x1="280" y1="70"  x2="370" y2="70"  class="edge" marker-end="url(#arrow)"/>
  <line x1="450" y1="70"  x2="530" y2="130" class="edge" marker-end="url(#arrow)"/>
  <line x1="280" y1="190" x2="530" y2="130" class="edge" marker-end="url(#arrow)"/>

  <!-- Nodes -->
  <g>
    <rect x="30"  y="112" width="80" height="36" rx="6" class="node"/>
    <text x="70"  y="135" text-anchor="middle" class="label">x</text>
  </g>
  <g>
    <rect x="200" y="52"  width="80" height="36" rx="6" class="node"/>
    <text x="240" y="75"  text-anchor="middle" class="label">a = x²</text>
  </g>
  <g>
    <rect x="200" y="172" width="80" height="36" rx="6" class="node"/>
    <text x="240" y="195" text-anchor="middle" class="label">c = e<tspan baseline-shift="super" font-size="11px">x</tspan></text>
  </g>
  <g>
    <rect x="370" y="52"  width="80" height="36" rx="6" class="node"/>
    <text x="410" y="75"  text-anchor="middle" class="label">b = sin(a)</text>
  </g>
  <g>
    <rect x="530" y="112" width="80" height="36" rx="6" class="node"/>
    <text x="570" y="135" text-anchor="middle" class="label">f = b · c</text>
  </g>
</svg>
